[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-provider-youtube-music"
dynamic = ["version"]
description = "OVOS MediaProvider plugin for YouTube Music (replaces ovos-skill-youtube-music)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "OpenVoiceOS", "OCP", "media", "youtube", "music", "MediaProvider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mediavocab>=1.0.0",
    "ovos-plugin-manager>=2.1",
    "tutubo>=4.3.0a1",
    "ytmusicapi",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-provider-youtube-music"
Source = "https://github.com/OpenVoiceOS/ovos-media-provider-youtube-music"

[project.entry-points."opm.media.provider"]
youtube_music = "ovos_media_provider_youtube_music:YouTubeMusicMediaProvider"

[tool.setuptools]
packages = ["ovos_media_provider_youtube_music"]

[tool.setuptools.dynamic]
version = { attr = "ovos_media_provider_youtube_music.version.__version__" }
